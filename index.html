<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start page</title>
<style>
:root{
  --bg1:#0d1626; --bg2:#152235; --surface:rgba(18,26,40,.72); --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.16);
  --text:#eef2f7; --muted:#9aa6b6; --accent:#7be1d4; --shadow:0 14px 40px rgba(0,0,0,.28);
  --radius-xl:28px; --radius-lg:20px; --tile-width:120px; --tile-height:100px; --tile-title-size:14px; --tile-visual-size:28px; --gap:14px; --content-width:1720px; --page-title-size:14px;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;color:var(--text);font:500 15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(140deg,var(--bg1),var(--bg2));overflow-y:auto}
button,input,select,textarea{font:inherit} a{color:inherit;text-decoration:none} img{max-width:100%;display:block}
button{border:none;border-radius:999px;color:var(--text);background:rgba(255,255,255,.09);padding:10px 14px;cursor:pointer;transition:.15s ease} button:hover{background:rgba(255,255,255,.14)}
button.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line)} button.primary{background:linear-gradient(135deg, rgba(123,225,212,.22), rgba(143,182,255,.22));border:1px solid rgba(123,225,212,.35)}
button.small{padding:7px 11px;font-size:13px} button.danger{background:rgba(255,90,90,.14);border:1px solid rgba(255,90,90,.28)} .hidden{display:none!important}
.bg-layer,.bg-image,.bg-overlay{position:fixed;inset:0}.bg-image{background-position:center;background-size:cover;opacity:.42}.bg-overlay{background:radial-gradient(1200px 500px at 10% -10%, rgba(123,225,212,.08), transparent 60%),radial-gradient(1200px 900px at 95% 10%, rgba(143,182,255,.11), transparent 55%),linear-gradient(180deg, rgba(7,11,18,.2), rgba(7,11,18,.45));backdrop-filter:blur(2px)}
.app{position:relative;z-index:1;width:min(calc(100vw - 28px), var(--content-width));margin:0 auto;padding:24px 0 40px}
.topbar{position:sticky;top:14px;z-index:50;display:grid;grid-template-columns:minmax(140px,.7fr) minmax(420px,1.7fr) auto;gap:16px;align-items:center;background:rgba(11,18,28,.66);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:var(--shadow);border-radius:26px;padding:14px 16px}
h1{margin:0;font-size:var(--page-title-size);line-height:1.08;font-weight:700}.subtitle{color:var(--muted);font-size:10px;line-height:1.3}.brand-block{display:flex;flex-direction:column;gap:4px;min-width:0}
.search-wrap{display:flex;align-items:center;min-width:0}.search-form{position:relative;width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.search-form input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font-size:15px}.search-form button{padding:10px 14px}
.provider-btn{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}.provider-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;max-height:280px;overflow:auto;padding:8px;border-radius:16px;background:rgba(10,16,25,.96);border:1px solid var(--line-strong);box-shadow:var(--shadow)}
.provider-option{width:100%;text-align:left;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.provider-option.active{background:linear-gradient(135deg, rgba(123,225,212,.25), rgba(143,182,255,.26));border:1px solid rgba(123,225,212,.4)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.toolbar .toggle.active{background:linear-gradient(135deg, rgba(123,225,212,.25), rgba(143,182,255,.26));border:1px solid rgba(123,225,212,.4)}
.main{margin-top:22px;display:grid;gap:18px}.group{background:rgba(11,18,28,.54);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:12px;backdrop-filter:blur(16px)}
.group.collapsed .tiles{display:none}.group-header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.group h2{margin:0;font-size:22px;line-height:1.1;font-weight:750;letter-spacing:-.03em}.group-meta{color:var(--muted);font-size:13px}.group-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tiles{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:flex-start;gap:var(--gap)}
.tile{position:relative;width:var(--tile-width);flex:0 0 var(--tile-width);min-height:var(--tile-height);border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),rgba(14,20,30,.72);overflow:hidden;transition:.18s ease;box-shadow: inset 0 1px 0 rgba(255,255,255,.05)}
.tile:hover{transform:translateY(-2px);border-color:rgba(123,225,212,.22);box-shadow:0 18px 36px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08)}
.tile-link{min-height:var(--tile-height);display:flex;align-items:center;justify-content:center;padding:8px 7px;cursor:pointer}.tile-shell{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.tile-visual{width:var(--tile-visual-size);height:var(--tile-visual-size);border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:var(--text);font-weight:800;font-size:calc(var(--tile-visual-size) * .24);text-align:center;line-height:1.03;padding:3px;overflow-wrap:anywhere;word-break:break-word}
.tile-visual img{width:100%;height:100%;object-fit:cover;border-radius:10px}.tile-title{font-size:var(--tile-title-size);line-height:1.1;font-weight:720;letter-spacing:-.01em;max-width:96%;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}.tile-title.small{font-size:calc(var(--tile-title-size) * .92)} .tile-actions{position:absolute;top:10px;right:10px;display:none;gap:6px}.edit-mode .tile-actions{display:flex}
.icon-btn{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:10px}.floating-add{position:fixed;right:24px;bottom:22px;z-index:40;display:none;box-shadow:var(--shadow)} .edit-mode .floating-add{display:inline-flex}
.footer{display:flex;justify-content:flex-start;gap:12px;margin-top:16px;padding:2px 4px 0;color:var(--muted);font-size:11px}.version-corner{position:fixed;right:12px;bottom:10px;z-index:70;color:var(--muted);font-size:11px;letter-spacing:.08em;background:rgba(10,16,25,.55);border:1px solid var(--line);border-radius:999px;padding:6px 10px;backdrop-filter:blur(10px)}
.modal-layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,7,12,.55);backdrop-filter:blur(6px);z-index:80}.modal-layer.open{display:flex}.modal{width:min(760px,100%);max-height:min(88vh,980px);overflow:auto;background:rgba(10,16,25,.94);border:1px solid var(--line-strong);border-radius:24px;box-shadow:0 28px 90px rgba(0,0,0,.48);padding:16px}.modal.narrow{width:min(620px,100%)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.modal-title{margin:0;font-size:22px;line-height:1.08;letter-spacing:-.03em}.modal-subtitle{color:var(--muted);font-size:12px;margin-top:5px}.close-btn{width:40px;height:40px;border-radius:11px;padding:0;display:grid;place-items:center;background:transparent;border:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input[type="text"],.field input[type="url"],.field input[type="number"],.field input[type="color"],.field textarea,.field select{width:100%;border:none;outline:none;color:var(--text);border-radius:11px;padding:11px 12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.field input[type="color"]{padding:0;height:46px;min-height:46px;border-radius:14px;background:rgba(255,255,255,.06);cursor:pointer;overflow:hidden}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.help{color:var(--muted);font-size:12px;line-height:1.45}.preview-card,.history-item{border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:14px}.range-wrap{display:flex;align-items:center;gap:12px}.range-wrap input[type="range"]{flex:1}.range-value{min-width:42px;text-align:right;color:var(--muted)}.modal-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}.checkbox{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04)} .checkbox input{accent-color:#8fd6cd}.history-list{display:grid;gap:10px}.empty-state{width:100%;border:1px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted);text-align:center}.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:90;display:grid;gap:10px}.toast{min-width:240px;max-width:min(420px, calc(100vw - 40px));padding:13px 15px;border-radius:18px;background:rgba(10,16,25,.94);color:var(--text);border:1px solid var(--line-strong);box-shadow:var(--shadow)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (max-width:1120px){.topbar{grid-template-columns:1fr}.toolbar{justify-content:flex-start}} @media (max-width:720px){.app{width:min(calc(100vw - 18px), var(--content-width));padding-top:12px}.topbar{top:10px;padding:12px;grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.group-header{align-items:flex-start;flex-direction:column}.group-actions{justify-content:flex-start}.tile{width:calc(50vw - 28px);flex-basis:calc(50vw - 28px)}}
</style>
</head>
<body>
<div class="bg-layer"><div class="bg-image" id="bgImage"></div><div class="bg-overlay"></div></div>
<div class="app" id="appRoot">
  <header class="topbar">
    <div class="brand-block"><h1 id="pageTitle">Start page</h1><div class="subtitle" id="pageSubtitle"></div></div>
    <div class="search-wrap"><form class="search-form" id="searchForm"><button class="provider-btn" id="providerToggleBtn" type="button">Search ▾</button><div class="provider-menu hidden" id="providerMenu"></div><span aria-hidden="true">⌕</span><input id="searchInput" type="text" placeholder="Search" autocomplete="off"><button class="small primary" type="submit" id="searchButton">Search</button></form></div>
    <div class="toolbar"><button class="toggle" id="editToggle" type="button">Edit mode</button><button class="secondary" id="addGroupTopBtn" type="button">New group</button><button class="secondary" id="settingsBtn" type="button">Settings</button><button class="secondary" id="importBtn" type="button">Import</button><button class="secondary" id="exportBtn" type="button">Export</button></div>
  </header>
  <main class="main" id="groupsRoot"></main>
  <div class="footer"><div><span id="footerSummary"></span></div></div>
</div>
<div class="version-corner" id="versionCorner"></div>
<button class="floating-add primary" id="addGroupFab" type="button">＋ New group</button>
<div class="modal-layer" id="modalLayer"><div class="modal" id="modal"><div class="modal-header"><div><h2 class="modal-title" id="modalHeading">Modal</h2><div class="modal-subtitle" id="modalSubtitle"></div></div><button class="close-btn" id="modalCloseBtn" type="button">✕</button></div><div id="modalContent"></div></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<script id="embedded-config" type="application/json">{"meta": {"appId": "nighttab-selfhosted", "appVersion": "2.4.0"}, "title": "Start page", "subtitle": "", "search": {"enabled": true, "openInNewTab": true, "placeholder": "Search", "activeProviderId": "google", "providers": [{"id": "google", "name": "Google", "url": "https://www.google.com/search", "queryName": "q"}, {"id": "bing", "name": "Bing", "url": "https://www.bing.com/search", "queryName": "q"}, {"id": "ddg", "name": "DuckDuckGo", "url": "https://duckduckgo.com/", "queryName": "q"}]}, "appearance": {"backgroundUrl": "", "gradientStart": "#0d1626", "gradientEnd": "#152235", "accent": "#7be1d4", "textColor": "#eef2f7", "mutedColor": "#9aa6b6", "pageTitleSize": 14, "tileWidth": 120, "tileHeight": 100, "tileTitleSize": 14, "tileVisualSize": 28, "gap": 14, "contentWidth": 1720, "showClock": true, "showDate": true}, "groups": [{"id": "group-welcome", "name": "Welcome", "collapsed": false, "items": []}]}</script>
<script>
(() => {
'use strict';
const APP_VERSION='2.4.0';
const DB_NAME='nighttab-localdrive-db';
const DB_VERSION=1;
const STORE='kv';
const STORAGE_KEY='nighttab-blank-localdrive-v240';
const HISTORY_KEY=STORAGE_KEY + '-history';
const MAX_HISTORY=20;
const embeddedConfig = JSON.parse(document.getElementById('embedded-config').textContent);
const state = { config:null, editMode:false, modal:null };
const el = {
  appRoot:document.getElementById('appRoot'), bgImage:document.getElementById('bgImage'), pageTitle:document.getElementById('pageTitle'), pageSubtitle:document.getElementById('pageSubtitle'),
  searchForm:document.getElementById('searchForm'), searchInput:document.getElementById('searchInput'), searchButton:document.getElementById('searchButton'), providerToggleBtn:document.getElementById('providerToggleBtn'), providerMenu:document.getElementById('providerMenu'),
  groupsRoot:document.getElementById('groupsRoot'), footerSummary:document.getElementById('footerSummary'), editToggle:document.getElementById('editToggle'), addGroupTopBtn:document.getElementById('addGroupTopBtn'), addGroupFab:document.getElementById('addGroupFab'), settingsBtn:document.getElementById('settingsBtn'), importBtn:document.getElementById('importBtn'), exportBtn:document.getElementById('exportBtn'), versionCorner:document.getElementById('versionCorner'),
  modalLayer:document.getElementById('modalLayer'), modal:document.getElementById('modal'), modalHeading:document.getElementById('modalHeading'), modalSubtitle:document.getElementById('modalSubtitle'), modalContent:document.getElementById('modalContent'), modalCloseBtn:document.getElementById('modalCloseBtn'), toastWrap:document.getElementById('toastWrap')
};
const $ = (s,r=document) => r.querySelector(s); const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function uid(prefix){ return `${prefix}-${Math.random().toString(36).slice(2,9)}`; }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }
function toast(message){ const node=document.createElement('div'); node.className='toast'; node.textContent=message; el.toastWrap.appendChild(node); setTimeout(()=>{node.style.opacity='0'; setTimeout(()=>node.remove(),200);},2600); }
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function showSaveStatus(message){ el.versionCorner.textContent=`v${APP_VERSION} • ${message}`; clearTimeout(showSaveStatus.t); showSaveStatus.t=setTimeout(()=>{el.versionCorner.textContent=`v${APP_VERSION}`;},1800); }
function deriveTitleFromUrl(url){ try{ const parsed=new URL(normalizeUrl(url)); const bits=decodeURIComponent(parsed.pathname).split('/').filter(Boolean); const last=bits[bits.length-1] || parsed.hostname.replace(/^www\./,''); return last.replace(/\.[a-z0-9]{2,6}$/i,'').replace(/[-_]+/g,' ').trim() || parsed.hostname.replace(/^www\./,''); } catch { return 'Link'; } }
function getHostname(url){ try{ return new URL(normalizeUrl(url)).hostname.replace(/^www\./,''); } catch { return ''; } }
function normalizeUrl(url){ const raw=String(url||'').trim(); if(!raw) return ''; if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw)) return raw; if(/^\/\//.test(raw)) return `https:${raw}`; return `https://${raw}`; }
function cssColorToHex(value,fallback='#000000'){ const raw=String(value||'').trim(); if(/^#([0-9a-f]{3}){1,2}$/i.test(raw)) return raw.length===4 ? '#' + raw.slice(1).split('').map(ch=>ch+ch).join('').toLowerCase() : raw.toLowerCase(); return fallback.toLowerCase(); }
function formatDateTime(iso){ const d=new Date(iso); return Number.isNaN(d.getTime()) ? iso : d.toLocaleString([], {year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }

function openDb(){ return new Promise((resolve,reject)=>{ const req=indexedDB.open(DB_NAME, DB_VERSION); req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); }; req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error || new Error('IndexedDB open failed')); }); }
async function idbGet(key){ const db=await openDb(); return await new Promise((resolve,reject)=>{ const tx=db.transaction(STORE,'readonly'); const req=tx.objectStore(STORE).get(key); req.onsuccess=()=>resolve(req.result ?? null); req.onerror=()=>reject(req.error || new Error('IndexedDB read failed')); }); }
async function idbSet(key,val){ const db=await openDb(); return await new Promise((resolve,reject)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(val,key); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error || new Error('IndexedDB write failed')); tx.onabort=()=>reject(tx.error || new Error('IndexedDB write aborted')); }); }
async function idbDelete(key){ const db=await openDb(); return await new Promise((resolve,reject)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(key); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error || new Error('IndexedDB delete failed')); }); }
async function readLocalConfig(){ try{ return await idbGet(STORAGE_KEY); } catch(err){ console.warn(err); return null; } }
async function readHistory(){ try{ return await idbGet(HISTORY_KEY) || []; } catch { return []; } }
async function saveLocalConfig(note){ try{ await idbSet(STORAGE_KEY, deepClone(state.config)); if(note){ const history=await readHistory(); history.unshift({id:uid('hist'), at:new Date().toISOString(), note, config:deepClone(state.config)}); await idbSet(HISTORY_KEY, history.slice(0,MAX_HISTORY)); } showSaveStatus('Saved'); } catch(err){ console.warn(err); toast('Could not save locally.'); showSaveStatus('Save failed'); } }

function ntItemToConfigItem(item){ const visual=item?.display?.visual || {}; const nameText=(item?.display?.name?.text||'').trim(); const letterText=(visual?.letter?.text||'').trim(); const title=nameText || letterText || deriveTitleFromUrl(item?.url||''); let visualType='text'; let imageUrl=''; if(visual?.type==='image' && visual?.image?.url){ visualType='image'; imageUrl=visual.image.url; } else if(visual?.type==='icon'){ visualType='favicon'; } return { id:uid('tile'), title, url:item?.url || '', visualType, badgeText:letterText || '', imageUrl, showBadgeWhenTitleExists:false, openInNewTab:true }; }
function ntBackupToConfig(backup){ const layout=backup?.state?.layout || {}; const header=backup?.state?.header || {}; const theme=backup?.state?.theme || {}; const gradient=theme?.background?.gradient || {}; const bgImage=theme?.background?.image?.url || ''; const accentRgb=theme?.custom?.all?.[0]?.accent?.rgb || theme?.accent?.rgb || {r:123,g:225,b:212}; const startRgb=gradient?.start?.rgb || {r:13,g:22,b:38}; const endRgb=gradient?.end?.rgb || {r:21,g:34,b:53}; const rgbCss=rgb=>`rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`; const providerName=header?.search?.engine?.custom?.name || 'Search'; const providerUrl=header?.search?.engine?.custom?.url || 'https://www.google.com/search'; const providerQueryName=header?.search?.engine?.custom?.queryName || 'q'; return { meta:{appId:'nighttab-selfhosted', appVersion:APP_VERSION, importedFrom:'nighttab-backup', importedAt:new Date().toISOString()}, title:layout?.title || 'Start page', subtitle:'', search:{ enabled:!!header?.search?.show, openInNewTab:header?.search?.newTab!==false, placeholder:providerName ? `Search ${providerName}` : 'Search', activeProviderId:'provider-1', providers:[{id:'provider-1', name:providerName, url:providerUrl, queryName:providerQueryName}] }, appearance:{ backgroundUrl:bgImage, gradientStart:rgbCss(startRgb), gradientEnd:rgbCss(endRgb), accent:rgbCss(accentRgb), textColor:'#eef2f7', mutedColor:'#9aa6b6', pageTitleSize:14, tileWidth:120, tileHeight:100, tileTitleSize:14, tileVisualSize:28, gap:clamp(layout?.gutter || 20, 6, 28), contentWidth:clamp((layout?.width || 95) * 18, 1100, 1800), showClock:!!header?.clock?.show, showDate:!!header?.date?.show }, groups:(backup?.bookmark || []).map(group=>({ id:uid('group'), name:group?.name?.text || 'Group', collapsed:!!group?.collapse, items:(group?.items || []).map(ntItemToConfigItem) })) }; }
function ensureConfigShape(config){ if(!config || typeof config !== 'object') return ntBackupToConfig(embeddedConfig); config.meta=config.meta || {appId:'nighttab-selfhosted', appVersion:APP_VERSION}; config.meta.appVersion=APP_VERSION; config.title=config.title || 'Start page'; config.subtitle=typeof config.subtitle === 'string' ? config.subtitle : ''; config.search=Object.assign({enabled:true, openInNewTab:true, placeholder:'Search', activeProviderId:null, providers:[]}, config.search || {}); if(!Array.isArray(config.search.providers) || !config.search.providers.length){ const legacyName=config.search.name || 'Search'; const legacyUrl=config.search.url || 'https://www.google.com/search'; const legacyQuery=config.search.queryName || 'q'; config.search.providers=[{id:uid('provider'), name:legacyName, url:legacyUrl, queryName:legacyQuery}]; } config.search.providers=config.search.providers.map(p=>({id:p.id || uid('provider'), name:p.name || 'Search', url:p.url || 'https://www.google.com/search', queryName:p.queryName || 'q'})); config.search.activeProviderId=config.search.providers.some(p=>p.id===config.search.activeProviderId) ? config.search.activeProviderId : config.search.providers[0].id; config.appearance=Object.assign({backgroundUrl:'', gradientStart:'#0d1626', gradientEnd:'#152235', accent:'#7be1d4', textColor:'#eef2f7', mutedColor:'#9aa6b6', pageTitleSize:14, tileWidth:120, tileHeight:100, tileTitleSize:14, tileVisualSize:28, gap:14, contentWidth:1720, showClock:true, showDate:true}, config.appearance || {}); config.groups=Array.isArray(config.groups) ? config.groups : []; config.groups=config.groups.map(group=>({ id:group.id || uid('group'), name:group.name || 'Group', collapsed:!!group.collapsed, items:Array.isArray(group.items) ? group.items.map(item=>({ id:item.id || uid('tile'), title:item.title || deriveTitleFromUrl(item.url || ''), url:item.url || '', visualType:['text','image','favicon'].includes(item.visualType) ? item.visualType : 'text', badgeText:item.badgeText || '', imageUrl:item.imageUrl || '', showBadgeWhenTitleExists:!!item.showBadgeWhenTitleExists, openInNewTab:item.openInNewTab !== false })) : [] })); return config; }
function defaultConfig(){ return ensureConfigShape(embeddedConfig?.state && Array.isArray(embeddedConfig?.bookmark) ? ntBackupToConfig(embeddedConfig) : embeddedConfig); }
async function loadInitialConfig(){ const local=await readLocalConfig(); return ensureConfigShape(local || defaultConfig()); }
function getActiveProvider(){ const providers=state.config?.search?.providers || []; return providers.find(p=>p.id===state.config?.search?.activeProviderId) || providers[0] || {name:'Search', url:'https://www.google.com/search', queryName:'q'}; }

function openImportModal(){ openModal({ title:'Import config', subtitle:'Use a NightTab backup or a selfhosted export JSON file.', width:'narrow', content:`<div class="form-grid"><div class="field full"><label for="importFileInput">JSON file</label><input id="importFileInput" type="file" accept=".json,application/json"></div><div class="help full">NightTab backup files are converted automatically. Selfhosted exports restore 1:1.</div><div class="modal-footer full"><div></div><div class="row"><button class="secondary" type="button" data-close-modal>Cancel</button><button class="primary" type="button" id="runImportBtn">Import file</button></div></div></div>`, onAfterOpen(){ $('#runImportBtn', el.modalContent).addEventListener('click', async ()=>{ const file=$('#importFileInput', el.modalContent).files?.[0]; if(!file){ toast('Pick a JSON file first.'); return; } let parsed; try{ parsed=JSON.parse(await file.text()); } catch { toast('That file is not valid JSON.'); return; } let nextConfig=null; if(parsed?.meta?.appId==='nighttab-selfhosted' && parsed?.groups) nextConfig=ensureConfigShape(parsed); else if(parsed?.state && Array.isArray(parsed?.bookmark)) nextConfig=ensureConfigShape(ntBackupToConfig(parsed)); if(!nextConfig){ toast('That JSON does not look like a supported config file.'); return; } state.config=nextConfig; render(); saveLocalConfig(`Imported ${file.name}`); closeModal(); toast('Import complete'); }); } }); }
function openExportModal(){ openModal({ title:'Export', subtitle:'Download your current setup as either this app\'s config or a NightTab-style backup.', width:'narrow', content:`<div class="form-grid"><div class="help full">Use the selfhosted export for this page. Use the NightTab export if you want a backup shaped like your original NightTab JSON.</div><div class="modal-footer full"><div></div><div class="row"><button class="secondary" type="button" data-close-modal>Close</button><button class="secondary" type="button" id="exportNightTabBtn">Export NightTab JSON</button><button class="primary" type="button" id="exportSelfBtn">Export selfhosted JSON</button></div></div></div>`, onAfterOpen(){ $('#exportSelfBtn', el.modalContent).addEventListener('click', ()=>{ const payload=deepClone(state.config); payload.meta=payload.meta || {}; payload.meta.appId='nighttab-selfhosted'; payload.meta.appVersion=APP_VERSION; payload.meta.exportedAt=new Date().toISOString(); exportJsonFile(`nighttab-selfhosted-config-v${APP_VERSION}.json`, payload); toast('Selfhosted config downloaded'); }); $('#exportNightTabBtn', el.modalContent).addEventListener('click', ()=>{ exportJsonFile(`nighttab-backup-compatible-v${APP_VERSION}.json`, configToNightTabBackup()); toast('NightTab-style backup downloaded'); }); } }); }
async function openHistoryModal(){ const history=await readHistory(); openModal({ title:'Versions', subtitle:'Local snapshots saved in your browser every time you make a change.', content:`<div class="history-list">${history.length ? history.map(entry=>`<div class="history-item"><div><div style="font-weight:700">${escapeHtml(entry.note || 'Saved state')}</div><div style="color:var(--muted);font-size:13px">${formatDateTime(entry.at)}</div></div><div class="row"><button type="button" class="small secondary" data-history-action="download" data-history-id="${entry.id}">Download</button><button type="button" class="small primary" data-history-action="restore" data-history-id="${entry.id}">Restore</button></div></div>`).join('') : `<div class="empty-state">No saved versions yet.</div>`}</div><div class="modal-footer full"><div><button class="danger ${history.length ? '' : 'hidden'}" type="button" id="clearHistoryBtn">Clear version history</button></div><div class="row"><button class="secondary" type="button" data-close-modal>Close</button></div></div>`, onAfterOpen(){ $$('[data-history-action]', el.modalContent).forEach(btn=>btn.addEventListener('click', ()=>{ const entry=history.find(x=>x.id===btn.dataset.historyId); if(!entry) return; if(btn.dataset.historyAction==='restore'){ if(!confirm(`Restore "${entry.note}" from ${formatDateTime(entry.at)}?`)) return; state.config=ensureConfigShape(entry.config); render(); saveLocalConfig('Restored version'); closeModal(); toast('Version restored'); } else { exportJsonFile(`nighttab-selfhosted-history-${entry.id}.json`, entry.config); } })); $('#clearHistoryBtn', el.modalContent)?.addEventListener('click', async ()=>{ if(!confirm('Clear all local version history?')) return; await idbDelete(HISTORY_KEY); closeModal(); toast('Version history cleared'); }); } }); }
function handleActionClick(event){ const btn=event.currentTarget; const action=btn.dataset.action; const groupId=btn.dataset.groupId; const itemId=btn.dataset.itemId; if(action==='add-tile') return openTileModal({groupId}); if(action==='edit-tile') return openTileModal({groupId,itemId}); if(action==='delete-tile') return deleteTile(groupId,itemId); if(action==='edit-group') return openGroupModal(groupId); if(action==='delete-group') return deleteGroup(groupId); if(action==='toggle-group') return toggleGroup(groupId); }
function toggleGroup(groupId){ const group=findGroup(groupId); if(!group) return; group.collapsed=!group.collapsed; render(); saveLocalConfig(group.collapsed ? 'Collapsed group' : 'Expanded group'); }
function deleteTile(groupId,itemId){ const group=findGroup(groupId); const item=findItem(groupId,itemId); if(!group || !item) return; if(!confirm(`Delete "${item.title}"?`)) return; group.items=group.items.filter(i=>i.id!==itemId); render(); saveLocalConfig('Deleted link'); }
function deleteGroup(groupId){ const group=findGroup(groupId); if(!group) return; if(!confirm(`Delete group "${group.name}" and all its links?`)) return; state.config.groups=state.config.groups.filter(g=>g.id!==groupId); render(); saveLocalConfig('Deleted group'); }
function runSearch(event){ event.preventDefault(); const query=el.searchInput.value.trim(); if(!query) return; const provider=getActiveProvider(); let url; try{ url=new URL(normalizeUrl(provider.url) || 'https://www.google.com/search'); } catch { url=new URL('https://www.google.com/search'); } url.searchParams.set(provider.queryName || 'q', query); if(state.config.search.openInNewTab) window.open(url.toString(), '_blank', 'noopener'); else location.href=url.toString(); }
async function boot(){ state.config=await loadInitialConfig(); render(); setInterval(formatClockAndDate, 30000); }
el.searchForm.addEventListener('submit', runSearch); el.providerToggleBtn.addEventListener('click', event=>{ event.stopPropagation(); el.providerMenu.classList.toggle('hidden'); }); document.addEventListener('click', event=>{ if(!el.searchForm.contains(event.target)) el.providerMenu.classList.add('hidden'); }); el.editToggle.addEventListener('click', ()=>{ state.editMode=!state.editMode; render(); }); el.addGroupTopBtn.addEventListener('click', ()=>openGroupModal()); el.addGroupFab.addEventListener('click', ()=>openGroupModal()); el.settingsBtn.addEventListener('click', openSettingsModal); el.importBtn.addEventListener('click', openImportModal); el.exportBtn.addEventListener('click', openExportModal); el.footerSummary.addEventListener('click', openHistoryModal); boot();
})();
</script>
</body>
</html>
