<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start page</title>
<style>
:root{
  --bg1:#0d1626;
  --bg2:#152235;
  --surface: rgba(18,26,40,.72);
  --page-title-size: 14px;
  --surface-strong: rgba(15,22,34,.9);
  --surface-soft: rgba(255,255,255,.06);
  --line: rgba(255,255,255,.1);
  --line-strong: rgba(255,255,255,.16);
  --text:#eef2f7;
  --muted: rgba(235,241,248,.66);
  --accent:#7be1d4;
  --accent-2:#8fb6ff;
  --shadow: 0 14px 40px rgba(0,0,0,.28);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --tile-width: 104px;
  --tile-height: 94px;
  --tile-title-size: 14px;
  --tile-visual-size: 28px;
  --gap: 14px;
  --content-width: 1720px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  color:var(--text);
  font: 500 15px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  background: linear-gradient(140deg, var(--bg1), var(--bg2));
  overflow-y:auto;
}
button,input,select,textarea{font:inherit}
button{
  border:none;
  border-radius:999px;
  color:var(--text);
  background:rgba(255,255,255,.09);
  padding:10px 14px;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
}
button:hover{background:rgba(255,255,255,.14)}
button:active{transform:translateY(1px)}
button.secondary{background:rgba(255,255,255,.06); border:1px solid var(--line)}
button.ghost{background:transparent; border:1px solid var(--line)}
button.primary{background:linear-gradient(135deg, rgba(123,225,212,.22), rgba(143,182,255,.22)); border:1px solid rgba(123,225,212,.35)}
button.danger{background:rgba(255,90,90,.14); border:1px solid rgba(255,90,90,.28)}
button.small{padding:7px 11px; font-size:13px}
a{color:inherit; text-decoration:none}
img{max-width:100%; display:block}

.bg-layer, .bg-image, .bg-overlay{
  position:fixed; inset:0;
}
.bg-image{
  background-position:center;
  background-size:cover;
  opacity:.42;
  filter:saturate(1.05);
}
.bg-overlay{
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(123,225,212,.08), transparent 60%),
    radial-gradient(1200px 900px at 95% 10%, rgba(143,182,255,.11), transparent 55%),
    linear-gradient(180deg, rgba(7,11,18,.2), rgba(7,11,18,.45));
  backdrop-filter: blur(2px);
}

.app{
  position:relative;
  z-index:1;
  width:min(calc(100vw - 28px), var(--content-width));
  margin:0 auto;
  padding:24px 0 40px;
}
.topbar{
  position:sticky;
  top:14px;
  z-index:50;
  display:grid;
  grid-template-columns: minmax(140px,.65fr) minmax(420px,1.75fr) auto;
  gap:16px;
  align-items:center;
  background:rgba(11,18,28,.66);
  border:1px solid var(--line);
  backdrop-filter: blur(18px);
  box-shadow: var(--shadow);
  border-radius:26px;
  padding:14px 16px;
}
.brand-block{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.eyebrow{display:none}
.eyebrow .dot{display:none}
h1{
  margin:0;
  font-size:var(--page-title-size);
  line-height:1.08;
  font-weight:700;
  letter-spacing:.01em;
}
.subtitle{
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
}
.search-wrap{
  display:flex;
  align-items:center;
  justify-content:stretch;
  min-width:0;
}
.search-form{
  width:100%;
  min-width:0;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
}
.search-form input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:15px;
}
.search-form button{padding:10px 14px}

.provider-switcher{position:relative; flex:0 0 auto}
.provider-btn{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:var(--text);
  font-size:13px;
  line-height:1.1;
  max-width:180px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.provider-btn:hover{background:rgba(255,255,255,.1)}
.provider-menu{
  position:absolute;
  top:calc(100% + 8px);
  left:0;
  min-width:220px;
  max-width:min(320px, 80vw);
  max-height:280px;
  overflow:auto;
  background:rgba(11,18,28,.96);
  border:1px solid var(--line-strong);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:8px;
  z-index:120;
  backdrop-filter: blur(18px);
}
.provider-option{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  text-align:left;
  border-radius:14px;
  padding:10px 12px;
  background:transparent;
  border:1px solid transparent;
}
.provider-option:hover{background:rgba(255,255,255,.07)}
.provider-option.active{background:rgba(123,225,212,.12); border-color:rgba(123,225,212,.28)}
.provider-option small{display:block; color:var(--muted); font-size:11px; margin-top:3px; word-break:break-all}
.provider-list{display:grid; gap:10px}
.provider-row{border:1px solid var(--line); border-radius:18px; padding:12px; background:rgba(255,255,255,.04)}
.provider-row-header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.provider-grid{display:grid; grid-template-columns:1.1fr 1.6fr .7fr auto; gap:10px; align-items:end}
@media (max-width: 900px){.provider-grid{grid-template-columns:1fr}}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
}
.toolbar .toggle.active,
.segmented button.active{
  background:linear-gradient(135deg, rgba(123,225,212,.25), rgba(143,182,255,.26));
  border:1px solid rgba(123,225,212,.4);
}

.main{
  margin-top:22px;
  display:grid;
  gap:18px;
}
.group{
  background:rgba(11,18,28,.54);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow: var(--shadow);
  padding:12px;
  backdrop-filter: blur(16px);
}
.group.collapsed .tiles,
.group.collapsed .dropzone{display:none}
.group-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.group-title-wrap{
  display:flex; align-items:center; gap:10px; min-width:0;
}
.drag-handle{
  width:34px; height:34px; display:grid; place-items:center;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--muted);
  cursor:grab;
  user-select:none;
}
.group h2{
  margin:0;
  font-size:22px;
  line-height:1.1;
  font-weight:750;
  letter-spacing:-.03em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.group-meta{color:var(--muted); font-size:13px}
.group-actions{
  display:flex; align-items:center; gap:8px;
  flex-wrap:wrap; justify-content:flex-end;
}
.tiles{
  display:flex;
  flex-wrap:wrap;
  align-items:stretch;
  justify-content:flex-start;
  gap:var(--gap);
}
.tile{
  position:relative;
  width:var(--tile-width);
  flex:0 0 var(--tile-width);
  min-height:var(--tile-height);
  border-radius:18px;
  border:1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02)),
    rgba(14,20,30,.72);
  overflow:hidden;
  transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.tile:hover{
  transform:translateY(-2px);
  border-color:rgba(123,225,212,.22);
  box-shadow: 0 18px 36px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08);
}
.tile.is-dragging{opacity:.35; transform:scale(.98)}
.tile.drag-over, .group.drag-over{outline:2px dashed rgba(123,225,212,.75); outline-offset:2px}
.tile-link{
  min-height:var(--tile-height);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 7px;
}
.tile-shell{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
}
.tile-visual{
  width:var(--tile-visual-size); height:var(--tile-visual-size);
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  color:var(--text);
  font-weight:800;
  font-size:calc(var(--tile-visual-size) * .24);
  text-align:center;
  line-height:1.03;
  padding:3px;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.tile-visual.hidden{display:none}
.tile-visual img{
  width:100%; height:100%;
  object-fit:cover;
  border-radius:10px;
}
.tile-title{
  font-size:var(--tile-title-size);
  line-height:1.1;
  font-weight:720;
  letter-spacing:-.01em;
  max-width:96%;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:5;
  overflow:hidden;
}
.tile-title.small{font-size:calc(var(--tile-title-size) * .92)}
.tile-badge-fallback{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:14px;
  font-weight:800;
}
.tile-actions{
  position:absolute;
  top:12px; right:12px;
  display:none;
  gap:8px;
}
.edit-mode .tile-actions,
.edit-mode .group-edit-actions{display:flex}
.icon-btn{
  width:34px; height:34px; padding:0;
  display:grid; place-items:center;
  border-radius:12px;
}
.dropzone{
  margin-top:12px;
  min-height:18px;
  border-radius:18px;
  border:1px dashed transparent;
}
.dropzone.active{
  min-height:54px;
  border-color:rgba(123,225,212,.75);
  background:rgba(123,225,212,.06);
}
.floating-add{
  position:fixed;
  right:24px; bottom:22px;
  z-index:40;
  display:none;
  box-shadow:var(--shadow);
}
.edit-mode .floating-add{display:inline-flex}

.footer{
  display:flex;
  justify-content:flex-start;
  gap:12px;
  margin-top:16px;
  padding:2px 4px 0;
  color:var(--muted);
  font-size:11px;
}
.footer a{color:var(--text)}

.modal-layer{
  position:fixed; inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(4,7,12,.55);
  backdrop-filter: blur(6px);
  z-index:80;
}
.modal-layer.open{display:flex}
.modal{
  width:min(760px, 100%);
  max-height:min(88vh, 980px);
  overflow:auto;
  background:rgba(10,16,25,.94);
  border:1px solid var(--line-strong);
  border-radius:24px;
  box-shadow:0 28px 90px rgba(0,0,0,.48);
  padding:16px;
}
.modal.narrow{width:min(620px,100%)}
.modal-header{
  display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  margin-bottom:14px;
}
.modal-title{
  margin:0;
  font-size:22px;
  line-height:1.08;
  letter-spacing:-.03em;
}
.modal-subtitle{
  color:var(--muted); font-size:12px; margin-top:5px;
}
.close-btn{
  width:40px;height:40px;border-radius:11px;padding:0;display:grid;place-items:center
}
.form-grid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap:14px;
}
.field{
  display:flex; flex-direction:column; gap:8px;
}
.field.full{grid-column:1 / -1}
.field label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}
.field input[type="text"],
.field input[type="url"],
.field input[type="number"],
.field input[type="color"],
.field textarea,
.field select{
  width:100%;
  border:none;
  outline:none;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
}
.field input[type="color"]{
  padding:0;
  height:46px;
  min-height:46px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  cursor:pointer;
  overflow:hidden;
}
.field input[type="color"]::-webkit-color-swatch-wrapper{padding:6px}
.field input[type="color"]::-webkit-color-swatch{
  border:none;
  border-radius:10px;
}
.field input[type="color"]::-moz-color-swatch{
  border:none;
  border-radius:10px;
}
.field textarea{min-height:102px; resize:vertical}
.row{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.help{
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
.preview-card{
  border-radius:22px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  padding:14px;
}
.segmented{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.segmented button{
  padding:9px 12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
}
.range-wrap{
  display:flex; align-items:center; gap:12px;
}
.range-wrap input[type="range"]{flex:1}
.range-value{
  min-width:42px;
  text-align:right;
  color:var(--muted);
}
.modal-footer{
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  margin-top:18px;
}
.history-list{
  display:grid; gap:10px;
}
.history-item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  border-radius:18px;
  padding:14px;
  display:flex; justify-content:space-between; gap:12px; align-items:center;
}
.history-item-title{font-weight:700}
.history-item-meta{color:var(--muted); font-size:13px}
.toast-wrap{
  position:fixed; right:20px; bottom:20px; z-index:90; display:grid; gap:10px;
}
.toast{
  min-width:240px;
  max-width:min(420px, calc(100vw - 40px));
  padding:13px 15px;
  border-radius:18px;
  background:rgba(10,16,25,.94);
  color:var(--text);
  border:1px solid var(--line-strong);
  box-shadow: var(--shadow);
}
.empty-state{
  width:100%;
  border:1px dashed var(--line);
  border-radius:18px;
  padding:18px;
  color:var(--muted);
  text-align:center;
}
.hidden{display:none !important}
.mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.checkbox{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.04);
}
.checkbox input{accent-color:#8fd6cd}

@media (max-width: 1120px){
  .topbar{grid-template-columns:1fr}
  .toolbar{justify-content:flex-start}
}
.version-corner{
  position:fixed;
  right:12px;
  bottom:10px;
  z-index:70;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.08em;
  background:rgba(10,16,25,.55);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 10px;
  backdrop-filter: blur(10px);
}

@media (max-width: 720px){
  .app{width:min(calc(100vw - 18px), var(--content-width)); padding-top:12px}
  .topbar{top:10px; padding:12px; grid-template-columns:1fr}
  .group, .modal{border-radius:24px}
  .form-grid{grid-template-columns:1fr}
  .group-header{align-items:flex-start; flex-direction:column}
  .group-actions{justify-content:flex-start}
  .footer{flex-direction:column}
  .tile{width:calc(50vw - 28px); flex-basis:calc(50vw - 28px)}
}
</style>
</head>
<body>
<div class="bg-layer">
  <div class="bg-image" id="bgImage"></div>
  <div class="bg-overlay"></div>
</div>

<div class="app" id="appRoot">
  <header class="topbar">
    <div class="brand-block">
      <h1 id="pageTitle">Start page</h1>
      <div class="subtitle" id="pageSubtitle"></div>
    </div>

    <div class="search-wrap">
      <form class="search-form" id="searchForm">
        <span aria-hidden="true">⌕</span>
        <div class="provider-switcher">
          <button class="provider-btn" type="button" id="searchProviderBtn" aria-haspopup="true" aria-expanded="false">Google ▾</button>
          <div class="provider-menu hidden" id="searchProviderMenu"></div>
        </div>
        <input id="searchInput" type="text" placeholder="Search" autocomplete="off">
        <button class="small primary" type="submit" id="searchButton">Search</button>
      </form>
    </div>

    <div class="toolbar">
      <button class="toggle" id="editToggle" type="button">Edit mode</button>
      <button class="secondary" id="addGroupTopBtn" type="button">New group</button>
      <button class="secondary" id="settingsBtn" type="button">Settings</button>
      <button class="secondary" id="importBtn" type="button">Import</button>
      <button class="secondary" id="exportBtn" type="button">Export</button>
    </div>
  </header>

  <main class="main" id="groupsRoot"></main>

  <div class="footer">
    <div><span id="footerSummary"></span></div>
  </div>
</div>

<div class="version-corner" id="versionCorner"></div>

<button class="floating-add primary" id="addGroupFab" type="button">＋ New group</button>

<div class="modal-layer" id="modalLayer">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="modalHeading">Modal</h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <button class="close-btn ghost" id="modalCloseBtn" type="button">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script id="embedded-nighttab-backup" type="application/json">{"nightTab": true, "version": "7.5.0", "state": {"layout": {"title": "Start page", "gutter": 20, "width": 95, "size": 60}, "header": {"search": {"show": true, "newTab": true, "engine": {"selected": "custom", "custom": {"url": "https://www.google.com/search", "name": "Google", "queryName": "q"}}}, "clock": {"show": true}, "date": {"show": true}}, "theme": {"background": {"gradient": {"start": {"rgb": {"r": 13, "g": 22, "b": 38}}, "end": {"rgb": {"r": 21, "g": 34, "b": 53}}}, "image": {"url": ""}}, "accent": {"rgb": {"r": 123, "g": 225, "b": 212}}}}, "bookmark": []}</script>

    toastWrap: document.getElementById("toastWrap"),
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  function uid(prefix = "id"){
    return prefix + "-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }

  function stripHtml(input){
    return String(input || "").replace(/[<>&]/g, (m) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
  }

  function deepClone(obj){
    return JSON.parse(JSON.stringify(obj));
  }

  function readLocalConfig(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      console.warn("Local config read failed", err);
      return null;
    }
  }

  function readHistory(){
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveLocalConfig(note){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.config));
      if (note) {
        const history = readHistory();
        history.unshift({
          id: uid("hist"),
          at: new Date().toISOString(),
          note,
          config: deepClone(state.config),
        });
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
      }
    } catch (err) {
      toast("Could not save locally. Storage may be full.");
      console.warn(err);
    }
  }

  function toast(message){
    const node = document.createElement("div");
    node.className = "toast";
    node.textContent = message;
    el.toastWrap.appendChild(node);
    setTimeout(() => {
      node.style.opacity = "0";
      node.style.transform = "translateY(4px)";
      setTimeout(() => node.remove(), 200);
    }, 2600);
  }

  function clamp(n, min, max){
    return Math.max(min, Math.min(max, n));
  }

  function formatDateTime(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleString([], {year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  }

  function deriveTitleFromUrl(url){
    try {
      const parsed = new URL(url);
      const bits = decodeURIComponent(parsed.pathname).split("/").filter(Boolean);
      const last = bits[bits.length - 1] || parsed.hostname.replace(/^www\./, "");
      const cleaned = last
        .replace(/\.[a-z0-9]{2,6}$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/%20/g, " ")
        .trim();
      return cleaned || parsed.hostname.replace(/^www\./, "");
    } catch (err) {
      return "Link";
    }
  }

  function getHostname(url){
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch (err) {
      return "";
    }
  }

  function hslFromRgb(rgb){
    const r = (rgb?.r ?? 32) / 255;
    const g = (rgb?.g ?? 43) / 255;
    const b = (rgb?.b ?? 62) / 255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h, s, l = (max + min) / 2;
    if (max === min){ h = s = 0; }
    else {
      const d = max - min;
      s = l > .5 ? d / (2 - max - min) : d / (max + min);
      switch(max){
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4;
      }
      h /= 6;
    }
    return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
  }

  function rgbToCss(rgb, fallback){
    if (rgb && typeof rgb.r === "number") return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    return fallback;
  }

  function cssColorToHex(value, fallback = "#000000"){
    const raw = String(value || "").trim();
    if (/^#([0-9a-f]{3}){1,2}$/i.test(raw)) {
      if (raw.length === 4) {
        return "#" + raw.slice(1).split("").map((ch) => ch + ch).join("").toLowerCase();
      }
      return raw.toLowerCase();
    }
    const rgb = raw.match(/^rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
    if (rgb) {
      const parts = rgb.slice(1, 4).map((n) => Math.max(0, Math.min(255, parseInt(n, 10))).toString(16).padStart(2, "0"));
      return "#" + parts.join("");
    }
    return fallback.toLowerCase();
  }

  function applySchemeToInputs(root, key){
    const scheme = COLOR_SCHEMES[key];
    if (!scheme || !root) return;
    const map = {
      gradientStartInput: scheme.gradientStart,
      gradientEndInput: scheme.gradientEnd,
      accentInput: scheme.accent,
      textColorInput: scheme.textColor,
      mutedColorInput: scheme.mutedColor,
    };
    Object.entries(map).forEach(([id, value]) => {
      const input = $("#" + id, root);
      if (input) input.value = value;
    });
  }

  function slugify(value){
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "") || uid("provider");
  }

  function normalizeSearchProvider(provider, fallbackLabel = "Search"){
    const label = String(provider?.label || provider?.name || fallbackLabel).trim() || fallbackLabel;
    const baseUrl = String(provider?.baseUrl || provider?.url || "https://www.google.com/search").trim() || "https://www.google.com/search";
    const queryParam = String(provider?.queryParam || provider?.queryName || "q").trim() || "q";
    return {
      id: String(provider?.id || slugify(label)),
      label,
      baseUrl,
      queryParam,
    };
  }

  function getSearchProviders(){
    const raw = Array.isArray(state.config?.search?.providers) ? state.config.search.providers : [];
    const cleaned = raw.map((provider) => normalizeSearchProvider(provider)).filter((provider, index, arr) => {
      return provider.baseUrl && arr.findIndex((x) => x.id === provider.id) === index;
    });
    if (cleaned.length) return cleaned;
    return [normalizeSearchProvider({label: state.config?.search?.name || "Google", baseUrl: state.config?.search?.url || "https://www.google.com/search", queryParam: state.config?.search?.queryName || "q"})];
  }

  function getDefaultSearchProvider(){
    const providers = getSearchProviders();
    const wantedId = state.config?.search?.defaultProviderId;
    return providers.find((provider) => provider.id === wantedId) || providers[0];
  }

  function buildSearchUrl(provider, query){
    let url;
    try {
      url = new URL(provider?.baseUrl || "https://www.google.com/search", location.href);
    } catch (err) {
      url = new URL("https://www.google.com/search", location.href);
    }
    url.searchParams.set(provider?.queryParam || "q", query);
    return url.toString();
  }

  function normalizeUrl(input){
    const raw = String(input || "").trim();
    if (!raw) return "";
    if (/^(mailto:|tel:|file:|https?:|ftp:)/i.test(raw)) return raw;
    if (raw.startsWith('//')) return 'https:' + raw;
    if (/^[\w.-]+\.[a-z]{2,}(?:[/:?#]|$)/i.test(raw)) return 'https://' + raw;
    return raw;
  }

  function openTileUrl(item){
    const url = normalizeUrl(item?.url || "");
    if (!url) {
      toast("This tile does not have a URL yet.");
      return;
    }
    if (item?.openInNewTab !== false) {
      window.open(url, "_blank", "noopener,noreferrer");
    } else {
      window.location.assign(url);
    }
  }

  function renderSearchProviderMenu(){
    if (!el.searchProviderBtn || !el.searchProviderMenu) return;
    const providers = getSearchProviders();
    const active = getDefaultSearchProvider();
    el.searchProviderBtn.textContent = `${active?.label || 'Search'} ▾`;
    el.searchProviderBtn.title = active?.label || 'Search';
    el.searchProviderMenu.innerHTML = providers.map((provider) => `
      <button type="button" class="provider-option ${provider.id === active?.id ? 'active' : ''}" data-provider-id="${escapeAttr(provider.id)}">
        <span><strong>${escapeHtml(provider.label)}</strong><small>${escapeHtml(provider.baseUrl)}</small></span>
        <span>${provider.id === active?.id ? '✓' : ''}</span>
      </button>
    `).join('');
  }

  function ntBackupToConfig(backup){
    const layout = backup?.state?.layout || {};
    const header = backup?.state?.header || {};
    const theme = backup?.state?.theme || {};
    const gradient = theme?.background?.gradient || {};
    const bgImage = theme?.background?.image?.url || "";
    const accentRgb = theme?.custom?.all?.[0]?.accent?.rgb || theme?.accent?.rgb || {r:123,g:225,b:212};
    const startRgb = gradient?.start?.rgb || {r:13,g:22,b:38};
    const endRgb = gradient?.end?.rgb || {r:21,g:34,b:53};
    const tileWidth = clamp((layout?.size || 60) * 4 + 40, 210, 330);
    const ntGroups = Array.isArray(backup?.bookmark) ? backup.bookmark : [];

    return {
      meta: {
        appId: "nighttab-selfhosted",
        appVersion: APP_VERSION,
        importedFrom: "nighttab-backup",
        importedAt: new Date().toISOString(),
      },
      title: layout?.title || "Start page",
      subtitle: "",
      search: {
        enabled: !!header?.search?.show,
        name: header?.search?.engine?.custom?.name || "Search",
        url: header?.search?.engine?.custom?.url || "https://www.google.com/search",
        queryName: header?.search?.engine?.custom?.queryName || "q",
        providers: [normalizeSearchProvider({
          label: header?.search?.engine?.custom?.name || "Search",
          baseUrl: header?.search?.engine?.custom?.url || "https://www.google.com/search",
          queryParam: header?.search?.engine?.custom?.queryName || "q",
        })],
        defaultProviderId: slugify(header?.search?.engine?.custom?.name || "Search"),
        openInNewTab: header?.search?.newTab !== false,
        placeholder: header?.search?.engine?.custom?.name ? `Search ${header.search.engine.custom.name}` : "Search",
      },
      appearance: {
        backgroundUrl: bgImage,
        gradientStart: rgbToCss(startRgb, "#0d1626"),
        gradientEnd: rgbToCss(endRgb, "#152235"),
        accent: rgbToCss(accentRgb, "#7be1d4"),
        textColor: "#eef2f7",
        mutedColor: "#9aa6b6",
        pageTitleSize: 14,
        tileWidth: 188,
        tileHeight: 152,
        gap: clamp(layout?.gutter || 20, 10, 28),
        contentWidth: clamp((layout?.width || 95) * 18, 1100, 1800),
        showClock: !!header?.clock?.show ?? true,
        showDate: !!header?.date?.show ?? true,
      },
      groups: ntGroups.map((group) => ({
        id: uid("group"),
        name: group?.name?.text || "Group",
        collapsed: !!group?.collapse,
        items: (group?.items || []).map((item) => ntItemToConfigItem(item))
      })),
      originalBackup: deepClone(backup),
    };
  }

  function ntItemToConfigItem(item){
    const visual = item?.display?.visual || {};
    const nameText = item?.display?.name?.text?.trim() || "";
    const letterText = visual?.letter?.text?.trim() || "";
    const title = nameText || letterText || deriveTitleFromUrl(item?.url || "");
    let visualType = "text";
    let imageUrl = "";
    if (visual?.type === "image" && visual?.image?.url) {
      visualType = "image";
      imageUrl = visual.image.url;
    } else if (visual?.type === "icon") {
      visualType = "favicon";
    } else {
      visualType = "text";
    }
    return {
      id: uid("tile"),
      title,
      url: item?.url || "",
      visualType,
      badgeText: letterText || "",
      imageUrl,
      showBadgeWhenTitleExists: false,
      openInNewTab: true,
    };
  }

  function defaultConfig(){
    return ensureConfigShape({
      meta: { appId: "nighttab-selfhosted", appVersion: APP_VERSION },
      title: "Start page",
      subtitle: "",
      search: {
        enabled: true,
        openInNewTab: true,
        placeholder: "Search",
        providers: [
          { id: "google", label: "Google", baseUrl: "https://www.google.com/search", queryParam: "q" },
          { id: "bing", label: "Bing", baseUrl: "https://www.bing.com/search", queryParam: "q" },
          { id: "duckduckgo", label: "DuckDuckGo", baseUrl: "https://duckduckgo.com/", queryParam: "q" }
        ],
        defaultProviderId: "google"
      },
      appearance: {
        backgroundUrl: "",
        gradientStart: "#0d1626",
        gradientEnd: "#152235",
        accent: "#7be1d4",
        textColor: "#eef2f7",
        mutedColor: "#9aa6b6",
        pageTitleSize: 14,
        tileWidth: 188,
        tileHeight: 152,
        tileTitleSize: 14,
        tileVisualSize: 28,
        gap: 20,
        contentWidth: 1710,
        showClock: true,
        showDate: true
      },
      groups: []
    });
  }

  function ensureConfigShape(config){
    if (!config || typeof config !== "object") return defaultConfig();
    config.meta = config.meta || { appId: "nighttab-selfhosted", appVersion: APP_VERSION };
    config.meta.appVersion = APP_VERSION;
    config.title = config.title || "Start page";
    config.subtitle = typeof config.subtitle === "string" ? config.subtitle : "";
    config.search = Object.assign({
      enabled: true, name: "Google", url: "https://www.google.com/search", queryName: "q", openInNewTab: true, placeholder: "Search", providers: [], defaultProviderId: "google"
    }, config.search || {});
    config.search.providers = (Array.isArray(config.search.providers) && config.search.providers.length
      ? config.search.providers
      : [normalizeSearchProvider({label: config.search.name || "Google", baseUrl: config.search.url || "https://www.google.com/search", queryParam: config.search.queryName || "q"})]
    ).map((provider) => normalizeSearchProvider(provider));
    config.search.defaultProviderId = config.search.defaultProviderId || config.search.providers[0]?.id || "google";
    const activeProvider = config.search.providers.find((provider) => provider.id === config.search.defaultProviderId) || config.search.providers[0];
    config.search.name = activeProvider?.label || config.search.name || "Search";
    config.search.url = activeProvider?.baseUrl || config.search.url || "https://www.google.com/search";
    config.search.queryName = activeProvider?.queryParam || config.search.queryName || "q";
    config.appearance = Object.assign({
      backgroundUrl: "", gradientStart: "#0d1626", gradientEnd: "#152235", accent: "#7be1d4", textColor: "#eef2f7", mutedColor: "#9aa6b6", pageTitleSize: 14, tileWidth: 104, tileHeight: 94, tileTitleSize: 14, tileVisualSize: 28, gap: 14, contentWidth: 1720, showClock: true, showDate: true
    }, config.appearance || {});
    config.groups = Array.isArray(config.groups) ? config.groups : [];
    config.groups = config.groups.map((group) => ({
      id: group.id || uid("group"),
      name: group.name || "Group",
      collapsed: !!group.collapsed,
      items: Array.isArray(group.items) ? group.items.map((item) => ({
        id: item.id || uid("tile"),
        title: item.title || deriveTitleFromUrl(item.url || ""),
        url: item.url || "",
        visualType: ["text","image","favicon"].includes(item.visualType) ? item.visualType : "text",
        badgeText: item.badgeText || "",
        imageUrl: item.imageUrl || "",
        showBadgeWhenTitleExists: !!item.showBadgeWhenTitleExists,
        openInNewTab: item.openInNewTab !== false,
      })) : []
    }));
    return config;
  }

  function loadInitialConfig(){
    const local = readLocalConfig();
    if (local) return ensureConfigShape(local);
    return ensureConfigShape(defaultConfig());
  }

  function applyAppearance(){
    const a = state.config.appearance;
    document.documentElement.style.setProperty("--bg1", a.gradientStart || "#0d1626");
    document.documentElement.style.setProperty("--bg2", a.gradientEnd || "#152235");
    document.documentElement.style.setProperty("--accent", a.accent || "#7be1d4");
    document.documentElement.style.setProperty("--text", a.textColor || "#eef2f7");
    document.documentElement.style.setProperty("--muted", a.mutedColor || "#9aa6b6");
    document.documentElement.style.setProperty("--page-title-size", `${clamp(+a.pageTitleSize || 14, 10, 28)}px`);
    document.documentElement.style.setProperty("--tile-width", `${clamp(+a.tileWidth || 104, 72, 220)}px`);
    document.documentElement.style.setProperty("--tile-height", `${clamp(+a.tileHeight || 94, 64, 180)}px`);
    document.documentElement.style.setProperty("--tile-title-size", `${clamp(+a.tileTitleSize || 14, 10, 22)}px`);
    document.documentElement.style.setProperty("--tile-visual-size", `${clamp(+a.tileVisualSize || 28, 18, 56)}px`);
    document.documentElement.style.setProperty("--gap", `${clamp(+a.gap || 14, 4, 28)}px`);
    document.documentElement.style.setProperty("--content-width", `${clamp(+a.contentWidth || 1720, 900, 2200)}px`);
    el.bgImage.style.backgroundImage = a.backgroundUrl ? `url("${a.backgroundUrl.replace(/"/g, '\\"')}")` : "none";
  }

  function formatClockAndDate(){
    const now = new Date();
    const a = state.config.appearance;
    const bits = [];
    if (a.showClock) {
      bits.push(now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}));
    }
    if (a.showDate) {
      bits.push(now.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"}));
    }
    el.pageSubtitle.textContent = state.config.subtitle || bits.join(" • ") || "";
    el.pageSubtitle.classList.toggle("hidden", !el.pageSubtitle.textContent.trim());
  }

  function getTileDisplay(item){
    const title = (item.title || "").trim();
    const hostname = getHostname(item.url);
    const fallbackText = (item.badgeText || title || hostname || "?").trim();
    const hideTextBadge = item.visualType === "text" && title && !item.showBadgeWhenTitleExists;
    if (item.visualType === "image" && item.imageUrl) {
      return {
        visualHtml: `<div class="tile-visual"><img src="${escapeAttr(item.imageUrl)}" alt=""></div>`,
        title,
      };
    }
    if (item.visualType === "favicon" && item.url) {
      const favicon = `${new URL(item.url, location.href).origin}/favicon.ico`;
      const fallback = (fallbackText[0] || "?").toUpperCase();
      return {
        visualHtml: `<div class="tile-visual"><img src="${escapeAttr(favicon)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'tile-badge-fallback',textContent:'${escapeAttr(fallback)}'}))"></div>`,
        title,
      };
    }
    return {
      visualHtml: hideTextBadge
        ? `<div class="tile-visual hidden"></div>`
        : `<div class="tile-visual">${escapeHtml(fallbackText)}</div>`,
      title,
    };
  }

  function escapeHtml(text){
    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function escapeAttr(text){
    return escapeHtml(text).replace(/"/g, "&quot;");
  }

  function render(){
    applyAppearance();
    if (el.versionBadge) el.versionBadge.textContent = `v${APP_VERSION}`;
    if (el.footerVersion) el.footerVersion.textContent = `v${APP_VERSION}`;
    if (el.versionCorner) el.versionCorner.textContent = `v${APP_VERSION}`;
    el.pageTitle.textContent = state.config.title;
    formatClockAndDate();
    el.searchForm.classList.toggle("hidden", !state.config.search.enabled);
    const activeProvider = getDefaultSearchProvider();
    el.searchInput.placeholder = state.config.search.placeholder || `Search ${activeProvider?.label || state.config.search.name || ""}`.trim();
    el.searchButton.textContent = "Search";
    renderSearchProviderMenu();
    el.appRoot.classList.toggle("edit-mode", state.editMode);
    el.editToggle.classList.toggle("active", state.editMode);
    el.editToggle.textContent = state.editMode ? "Done editing" : "Edit mode";

    const groupCount = state.config.groups.length;
    const tileCount = state.config.groups.reduce((sum, group) => sum + group.items.length, 0);
    el.footerSummary.textContent = `${tileCount} links across ${groupCount} groups`;

    el.groupsRoot.innerHTML = state.config.groups.map((group, groupIndex) => {
      const itemsHtml = group.items.map((item, itemIndex) => {
        const display = getTileDisplay(item);
        const titleClass = (display.title || "").length > 42 ? "tile-title small" : "tile-title";
        return `
          <article class="tile" data-group-id="${group.id}" data-item-id="${item.id}" draggable="${state.editMode}">
            <a class="tile-link" href="${escapeAttr(normalizeUrl(item.url) || "#")}" ${item.openInNewTab ? `target="_blank" rel="noreferrer"` : ""}>
              <div class="tile-shell">
                ${display.visualHtml}
                <div class="${titleClass}">${escapeHtml(display.title || deriveTitleFromUrl(item.url || ""))}</div>
              </div>
            </a>
            <div class="tile-actions">
              <button class="icon-btn secondary" type="button" data-action="edit-tile" data-group-id="${group.id}" data-item-id="${item.id}" title="Edit tile">✎</button>
              <button class="icon-btn danger" type="button" data-action="delete-tile" data-group-id="${group.id}" data-item-id="${item.id}" title="Delete tile">✕</button>
            </div>
          </article>`;
      }).join("");

      return `
        <section class="group ${group.collapsed ? "collapsed" : ""}" data-group-id="${group.id}">
          <div class="group-header" data-group-id="${group.id}">
            <div class="group-title-wrap">
              <div class="drag-handle group-drag" draggable="${state.editMode}" title="Drag to reorder group">⋮⋮</div>
              <div>
                <h2>${escapeHtml(group.name)}</h2>
                <div class="group-meta">${group.items.length} links</div>
              </div>
            </div>
            <div class="group-actions">
              <button class="small secondary" type="button" data-action="toggle-group" data-group-id="${group.id}">${group.collapsed ? "Expand" : "Collapse"}</button>
              <button class="small secondary group-edit-actions" type="button" data-action="add-tile" data-group-id="${group.id}">Add link</button>
              <button class="small secondary group-edit-actions" type="button" data-action="edit-group" data-group-id="${group.id}">Edit</button>
              <button class="small danger group-edit-actions" type="button" data-action="delete-group" data-group-id="${group.id}">Delete</button>
            </div>
          </div>
          <div class="tiles" data-group-id="${group.id}">
            ${itemsHtml || `<div class="empty-state">No links yet. Use <strong>Add link</strong> to start this group.</div>`}
          </div>
          <div class="dropzone" data-group-id="${group.id}"></div>
        </section>`;
    }).join("");

    attachTileInteractions();
  }

  function attachTileInteractions(){
    $$("[data-action]").forEach((btn) => {
      btn.addEventListener("click", handleActionClick);
    });

    $$(".tile-link").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (state.editMode) event.preventDefault();
      });
    });

    if (!state.editMode) return;

    $$(".tile").forEach((tile) => {
      tile.addEventListener("dragstart", onTileDragStart);
      tile.addEventListener("dragover", onTileDragOver);
      tile.addEventListener("dragleave", () => tile.classList.remove("drag-over"));
      tile.addEventListener("drop", onTileDropOnTile);
      tile.addEventListener("dragend", clearDragClasses);
    });

    $$(".tile-link").forEach((link) => {
      link.addEventListener("click", (event) => {
        if (state.editMode) {
          event.preventDefault();
          return;
        }
        const tile = link.closest('.tile');
        const group = state.config.groups.find((g) => g.id === tile?.dataset.groupId);
        const item = group?.items.find((entry) => entry.id === tile?.dataset.itemId);
        if (!item) return;
        event.preventDefault();
        openTileUrl(item);
      });
    });

    $$(".dropzone").forEach((zone) => {
      zone.addEventListener("dragover", onDropzoneDragOver);
      zone.addEventListener("dragleave", () => zone.classList.remove("active"));
      zone.addEventListener("drop", onDropzoneDrop);
    });

    $$(".group-drag").forEach((handle) => {
      handle.addEventListener("dragstart", onGroupDragStart);
      handle.addEventListener("dragend", clearDragClasses);
    });

    $$(".group-header").forEach((header) => {
      header.addEventListener("dragover", onGroupHeaderDragOver);
      header.addEventListener("dragleave", () => header.closest(".group")?.classList.remove("drag-over"));
      header.addEventListener("drop", onGroupHeaderDrop);
    });
  }

  function clearDragClasses(){
    $$(".drag-over").forEach((node) => node.classList.remove("drag-over"));
    $$(".dropzone.active").forEach((node) => node.classList.remove("active"));
    $$(".is-dragging").forEach((node) => node.classList.remove("is-dragging"));
    state.drag = null;
  }

  function onTileDragStart(event){
    const tile = event.currentTarget;
    state.drag = {
      type: "tile",
      fromGroupId: tile.dataset.groupId,
      itemId: tile.dataset.itemId,
    };
    tile.classList.add("is-dragging");
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", tile.dataset.itemId);
  }

  function onTileDragOver(event){
    event.preventDefault();
    if (!state.drag || state.drag.type !== "tile") return;
    const tile = event.currentTarget;
    if (tile.dataset.itemId === state.drag.itemId) return;
    tile.classList.add("drag-over");
  }

  function onTileDropOnTile(event){
    event.preventDefault();
    const targetTile = event.currentTarget;
    targetTile.classList.remove("drag-over");
    if (!state.drag || state.drag.type !== "tile") return;
    if (targetTile.dataset.itemId === state.drag.itemId) return;
    moveTileBefore(state.drag.fromGroupId, state.drag.itemId, targetTile.dataset.groupId, targetTile.dataset.itemId);
    clearDragClasses();
  }

  function onDropzoneDragOver(event){
    event.preventDefault();
    if (!state.drag || state.drag.type !== "tile") return;
    event.currentTarget.classList.add("active");
  }

  function onDropzoneDrop(event){
    event.preventDefault();
    const zone = event.currentTarget;
    zone.classList.remove("active");
    if (!state.drag || state.drag.type !== "tile") return;
    moveTileToGroupEnd(state.drag.fromGroupId, state.drag.itemId, zone.dataset.groupId);
    clearDragClasses();
  }

  function onGroupDragStart(event){
    const groupId = event.currentTarget.closest(".group-header").dataset.groupId;
    state.drag = { type: "group", groupId };
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", groupId);
  }

  function onGroupHeaderDragOver(event){
    event.preventDefault();
    if (!state.drag || state.drag.type !== "group") return;
    event.currentTarget.closest(".group").classList.add("drag-over");
  }

  function onGroupHeaderDrop(event){
    event.preventDefault();
    const targetGroup = event.currentTarget.dataset.groupId;
    event.currentTarget.closest(".group").classList.remove("drag-over");
    if (!state.drag || state.drag.type !== "group" || state.drag.groupId === targetGroup) return;
    moveGroupBefore(state.drag.groupId, targetGroup);
    clearDragClasses();
  }

  function moveTileBefore(fromGroupId, itemId, targetGroupId, targetItemId){
    const sourceGroup = state.config.groups.find((g) => g.id === fromGroupId);
    const targetGroup = state.config.groups.find((g) => g.id === targetGroupId);
    if (!sourceGroup || !targetGroup) return;
    const sourceIndex = sourceGroup.items.findIndex((i) => i.id === itemId);
    const targetIndex = targetGroup.items.findIndex((i) => i.id === targetItemId);
    if (sourceIndex < 0 || targetIndex < 0) return;
    const [moved] = sourceGroup.items.splice(sourceIndex, 1);
    const adjustedIndex = sourceGroup === targetGroup && sourceIndex < targetIndex ? targetIndex - 1 : targetIndex;
    targetGroup.items.splice(adjustedIndex, 0, moved);
    render();
    saveLocalConfig("Reordered links");
  }

  function moveTileToGroupEnd(fromGroupId, itemId, targetGroupId){
    const sourceGroup = state.config.groups.find((g) => g.id === fromGroupId);
    const targetGroup = state.config.groups.find((g) => g.id === targetGroupId);
    if (!sourceGroup || !targetGroup) return;
    const sourceIndex = sourceGroup.items.findIndex((i) => i.id === itemId);
    if (sourceIndex < 0) return;
    const [moved] = sourceGroup.items.splice(sourceIndex, 1);
    targetGroup.items.push(moved);
    render();
    saveLocalConfig("Moved link to group");
  }

  function moveGroupBefore(sourceGroupId, targetGroupId){
    const sourceIndex = state.config.groups.findIndex((g) => g.id === sourceGroupId);
    const targetIndex = state.config.groups.findIndex((g) => g.id === targetGroupId);
    if (sourceIndex < 0 || targetIndex < 0) return;
    const [moved] = state.config.groups.splice(sourceIndex, 1);
    const adjusted = sourceIndex < targetIndex ? targetIndex - 1 : targetIndex;
    state.config.groups.splice(adjusted, 0, moved);
    render();
    saveLocalConfig("Reordered groups");
  }

  function handleActionClick(event){
    const btn = event.currentTarget;
    const action = btn.dataset.action;
    const groupId = btn.dataset.groupId;
    const itemId = btn.dataset.itemId;

    if (action === "add-tile") return openTileModal({ groupId });
    if (action === "edit-tile") return openTileModal({ groupId, itemId });
    if (action === "delete-tile") return deleteTile(groupId, itemId);
    if (action === "edit-group") return openGroupModal(groupId);
    if (action === "delete-group") return deleteGroup(groupId);
    if (action === "toggle-group") return toggleGroup(groupId);
  }

  function toggleGroup(groupId){
    const group = state.config.groups.find((g) => g.id === groupId);
    if (!group) return;
    group.collapsed = !group.collapsed;
    render();
    saveLocalConfig(group.collapsed ? "Collapsed group" : "Expanded group");
  }

  function deleteTile(groupId, itemId){
    const group = state.config.groups.find((g) => g.id === groupId);
    if (!group) return;
    const item = group.items.find((i) => i.id === itemId);
    if (!item) return;
    if (!confirm(`Delete "${item.title}"?`)) return;
    group.items = group.items.filter((i) => i.id !== itemId);
    render();
    saveLocalConfig("Deleted link");
    toast("Link deleted");
  }

  function deleteGroup(groupId){
    const group = state.config.groups.find((g) => g.id === groupId);
    if (!group) return;
    if (!confirm(`Delete group "${group.name}" and all its links?`)) return;
    state.config.groups = state.config.groups.filter((g) => g.id !== groupId);
    render();
    saveLocalConfig("Deleted group");
    toast("Group deleted");
  }

  function openModal({title, subtitle = "", width = "wide", content, onAfterOpen}){
    state.modal = { title, subtitle };
    el.modalHeading.textContent = title;
    el.modalSubtitle.textContent = subtitle;
    el.modal.classList.toggle("narrow", width === "narrow");
    el.modalContent.innerHTML = content;
    el.modalLayer.classList.add("open");
    document.body.style.overflow = "hidden";
    bindModalInternalActions();
    if (typeof onAfterOpen === "function") onAfterOpen();
  }

  function closeModal(){
    el.modalLayer.classList.remove("open");
    document.body.style.overflow = "";
    state.modal = null;
    el.modalContent.innerHTML = "";
  }

  function bindModalInternalActions(){
    $$("[data-close-modal]", el.modalContent).forEach((btn) => btn.addEventListener("click", closeModal));
  }

  el.modalLayer.addEventListener("click", (event) => {
    if (event.target === el.modalLayer) closeModal();
  });
  el.modal.addEventListener("click", (event) => event.stopPropagation());
  el.modalCloseBtn.addEventListener("click", closeModal);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && el.modalLayer.classList.contains("open")) closeModal();
  });

  function findGroup(groupId){
    return state.config.groups.find((g) => g.id === groupId);
  }

  function findItem(groupId, itemId){
    return findGroup(groupId)?.items.find((i) => i.id === itemId);
  }

  function openGroupModal(groupId){
    const editing = !!groupId;
    const group = editing ? findGroup(groupId) : { name: "", collapsed: false };
    openModal({
      title: editing ? "Edit group" : "New group",
      subtitle: editing ? "Change the group name or collapse state." : "Add a fresh section to your start page.",
      width: "narrow",
      content: `
        <form id="groupForm" class="form-grid">
          <div class="field full">
            <label for="groupName">Group name</label>
            <input id="groupName" name="name" type="text" value="${escapeAttr(group.name || "")}" placeholder="e.g. Weekly work">
          </div>
          <label class="checkbox full"><input id="groupCollapsed" type="checkbox" ${group.collapsed ? "checked" : ""}> Start collapsed</label>
          <div class="modal-footer full">
            <div></div>
            <div class="row">
              <button class="secondary" type="button" data-close-modal>Cancel</button>
              <button class="primary" type="submit">${editing ? "Save group" : "Create group"}</button>
            </div>
          </div>
        </form>
      `,
      onAfterOpen(){
        $("#groupName", el.modalContent)?.focus();
        $("#groupForm", el.modalContent).addEventListener("submit", (event) => {
          event.preventDefault();
          const name = $("#groupName", el.modalContent).value.trim() || "Untitled group";
          const collapsed = $("#groupCollapsed", el.modalContent).checked;
          if (editing) {
            const target = findGroup(groupId);
            if (!target) return;
            target.name = name;
            target.collapsed = collapsed;
            saveLocalConfig("Updated group");
          } else {
            state.config.groups.push({ id: uid("group"), name, collapsed, items: [] });
            saveLocalConfig("Created group");
          }
          render();
          closeModal();
          toast(editing ? "Group updated" : "Group created");
        });
      }
    });
  }

  function openTileModal({groupId, itemId}){
    const group = findGroup(groupId);
    if (!group) return;
    const editing = !!itemId;
    const item = editing ? deepClone(findItem(groupId, itemId)) : {
      title: "",
      url: "",
      visualType: "favicon",
      badgeText: "",
      imageUrl: "",
      showBadgeWhenTitleExists: false,
      openInNewTab: true,
    };

    openModal({
      title: editing ? "Edit link" : "Add link",
      subtitle: editing ? `Update this tile in ${group.name}.` : `Add a new tile to ${group.name}.`,
      content: `
        <form id="tileForm" class="form-grid">
          <div class="field">
            <label for="tileTitle">Title</label>
            <input id="tileTitle" name="title" type="text" value="${escapeAttr(item.title || "")}" placeholder="Shown on the tile">
          </div>
          <div class="field">
            <label for="tileUrl">Link URL</label>

            <label>Visual style</label>

            </div>
            <input id="tileVisualType" type="hidden" value="${escapeAttr(item.visualType)}">
          </div>

          <div class="field">
            <label for="tileBadgeText">Text badge</label>
            <input id="tileBadgeText" name="badgeText" type="text" value="${escapeAttr(item.badgeText || "")}" placeholder="Used only for text tiles">
            <div class="help">If the tile has a title, the text badge stays hidden by default to keep the card clean.</div>
          </div>

          <div class="field full" id="imageUrlField">
            <label for="tileImageUrl">Image URL</label>
            <input id="tileImageUrl" name="imageUrl" type="url" value="${escapeAttr(item.imageUrl || "")}" placeholder="https://...">
            <div class="row" style="margin-top:8px">
              <input id="tileImageUpload" type="file" accept="image/*">
              <button type="button" class="secondary small" id="clearTileImageBtn">Clear image</button>
            </div>
            <div class="help">For image tiles you can paste a URL or upload a local image. Uploads are stored inside the config as data URLs.</div>
          </div>

          <label class="checkbox full"><input id="showBadgeWhenTitleExists" type="checkbox" ${item.showBadgeWhenTitleExists ? "checked" : ""}> Show text badge even when the tile already has a title</label>
          <label class="checkbox full"><input id="openInNewTab" type="checkbox" ${item.openInNewTab !== false ? "checked" : ""}> Open link in new tab</label>

          <div class="field full">
            <label>Preview</label>
            <div class="preview-card">
              <div id="tilePreview"></div>
            </div>
          </div>

          <div class="modal-footer full">
            <div></div>
            <div class="row">
              <button class="secondary" type="button" data-close-modal>Cancel</button>
              <button class="primary" type="submit">${editing ? "Save link" : "Add link"}</button>
            </div>
          </div>
        </form>
      `,
      onAfterOpen(){
        $("#tileTitle", el.modalContent)?.focus();
        const form = $("#tileForm", el.modalContent);
        const visualHidden = $("#tileVisualType", el.modalContent);
        const previewNode = $("#tilePreview", el.modalContent);
        const imageUrlField = $("#imageUrlField", el.modalContent);

        function updateSegment(type){
          visualHidden.value = type;
          $$("[data-visual-type]", el.modalContent).forEach((btn) => btn.classList.toggle("active", btn.dataset.visualType === type));
          imageUrlField.classList.toggle("hidden", type !== "image");
          renderPreview();
        }

        function collectForm(){
          return {
            id: item.id || uid("tile"),
            title: $("#tileTitle", el.modalContent).value.trim() || deriveTitleFromUrl($("#tileUrl", el.modalContent).value.trim()),
            url: $("#tileUrl", el.modalContent).value.trim(),
            visualType: visualHidden.value,
            badgeText: $("#tileBadgeText", el.modalContent).value.trim(),
            imageUrl: $("#tileImageUrl", el.modalContent).value.trim(),
            showBadgeWhenTitleExists: $("#showBadgeWhenTitleExists", el.modalContent).checked,
            openInNewTab: $("#openInNewTab", el.modalContent).checked,
          };
        }

        function renderPreview(){
          const draft = collectForm();
          const display = getTileDisplay(draft);
          previewNode.innerHTML = `
            <article class="tile" style="width:var(--tile-width); min-height:var(--tile-height);">
              <div class="tile-link" href="#">
                <div class="tile-shell">
                  ${display.visualHtml}
                  <div class="${(draft.title || "").length > 42 ? "tile-title small" : "tile-title"}">${escapeHtml(draft.title)}</div>
                </div>
              </div>
            </article>`;
        }

        $$("[data-visual-type]", el.modalContent).forEach((btn) => btn.addEventListener("click", () => updateSegment(btn.dataset.visualType)));
        ["tileTitle","tileUrl","tileBadgeText","tileImageUrl","showBadgeWhenTitleExists"].forEach((id) => {
          const node = $("#" + id, el.modalContent);
          node?.addEventListener(node.type === "checkbox" ? "change" : "input", renderPreview);
        });

        $("#tileImageUpload", el.modalContent).addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          $("#tileImageUrl", el.modalContent).value = await fileToDataUrl(file);
          updateSegment("image");
          toast("Image added to the tile");
        });

        $("#clearTileImageBtn", el.modalContent).addEventListener("click", () => {
          $("#tileImageUrl", el.modalContent).value = "";
          renderPreview();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const draft = collectForm();
          if (!draft.url) {
            toast("Please add a link URL.");
            return;
          }
          if (editing) {
            const target = findItem(groupId, itemId);
            Object.assign(target, draft);
            saveLocalConfig("Updated link");
          } else {
            group.items.push(draft);
            saveLocalConfig("Added link");
          }
          render();
          closeModal();
          toast(editing ? "Link updated" : "Link added");
        });

        updateSegment(item.visualType || "favicon");
      }
    });
  }

  function fileToDataUrl(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

                <div class="field"><label>Label</label><input type="text" data-provider-field="label" value="${escapeAttr(provider.label)}"></div>
                <div class="field"><label>Base URL</label><input type="url" data-provider-field="baseUrl" value="${escapeAttr(provider.baseUrl)}" placeholder="https://www.google.com/search"></div>
                <div class="field"><label>Query param</label><input type="text" data-provider-field="queryParam" value="${escapeAttr(provider.queryParam || 'q')}"></div>
                <div class="field"><label>&nbsp;</label><div class="help">Shown in the search dropdown</div></div>
              </div>
            </div>
          `).join('');
          $$('[data-remove-provider]', providerList).forEach((btn) => btn.addEventListener('click', () => {
            state.config.search.providers = state.config.search.providers.filter((provider) => provider.id !== btn.dataset.removeProvider);
            renderProviderRows();
          }));
        };
        renderProviderRows();

        $("#addProviderBtn", el.modalContent).addEventListener('click', () => {
          state.config.search.providers = [...state.config.search.providers, normalizeSearchProvider({
            id: uid('provider'),
            label: 'New provider',
            baseUrl: 'https://www.google.com/search',
            queryParam: 'q'
          })];
          renderProviderRows();
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          state.config.title = $("#pageTitleInput", el.modalContent).value.trim() || "Start page";
          state.config.subtitle = $("#pageSubtitleInput", el.modalContent).value.trim();
          state.config.search.placeholder = $("#searchPlaceholderInput", el.modalContent).value.trim() || 'Search';
          const providers = $$('[data-provider-row]', providerList).map((row, index) => normalizeSearchProvider({
            id: row.dataset.providerId || uid('provider'),
            label: $('[data-provider-field="label"]', row)?.value || `Provider ${index+1}`,
            baseUrl: $('[data-provider-field="baseUrl"]', row)?.value || 'https://www.google.com/search',
            queryParam: $('[data-provider-field="queryParam"]', row)?.value || 'q'
          })).filter((provider) => provider.label && provider.baseUrl);
          state.config.search.providers = providers.length ? providers : [normalizeSearchProvider({id:'google', label:'Google', baseUrl:'https://www.google.com/search', queryParam:'q'})];
          state.config.search.defaultProviderId = $('input[name="defaultProvider"]:checked', providerList)?.value || state.config.search.providers[0].id;
          const activeProvider = state.config.search.providers.find((provider) => provider.id === state.config.search.defaultProviderId) || state.config.search.providers[0];
          state.config.search.name = activeProvider.label;
          state.config.search.url = activeProvider.baseUrl;
          state.config.search.queryName = activeProvider.queryParam;
          state.config.search.enabled = $("#searchEnabledInput", el.modalContent).checked;
          state.config.search.openInNewTab = $("#searchNewTabInput", el.modalContent).checked;
          state.config.appearance.showClock = $("#showClockInput", el.modalContent).checked;
          state.config.appearance.showDate = $("#showDateInput", el.modalContent).checked;
          state.config.appearance.backgroundUrl = $("#backgroundUrlInput", el.modalContent).value.trim();
          state.config.appearance.pageTitleSize = +$("#pageTitleSizeInput", el.modalContent).value;
          state.config.appearance.gradientStart = $("#gradientStartInput", el.modalContent).value.trim() || "#0d1626";
          state.config.appearance.gradientEnd = $("#gradientEndInput", el.modalContent).value.trim() || "#152235";
          state.config.appearance.accent = $("#accentInput", el.modalContent).value.trim() || "#7be1d4";
          state.config.appearance.textColor = $("#textColorInput", el.modalContent).value.trim() || "#eef2f7";
          state.config.appearance.mutedColor = $("#mutedColorInput", el.modalContent).value.trim() || "#9aa6b6";
          state.config.appearance.tileWidth = +$("#tileWidthInput", el.modalContent).value;
          state.config.appearance.tileHeight = +$("#tileHeightInput", el.modalContent).value;
          state.config.appearance.tileTitleSize = +$("#tileTitleSizeInput", el.modalContent).value;
          state.config.appearance.tileVisualSize = +$("#tileVisualSizeInput", el.modalContent).value;
          state.config.appearance.gap = +$("#gapInput", el.modalContent).value;
          state.config.appearance.contentWidth = +$("#contentWidthInput", el.modalContent).value;
          render();
          saveLocalConfig("Updated settings");
          closeModal();
          toast("Settings saved");
        });
      }
    });
  }

  function rangeField(id, label, value, min, max, step){
    return `
      <div class="field">
        <label for="${id}">${label}</label>
        <div class="range-wrap">
          <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}">
          <div class="range-value mono" id="${id}Value">${value}</div>
        </div>
      </div>
    `;
  }

  function openImportModal(){
    openModal({
      title: "Import config",
      subtitle: "Use a NightTab backup or a selfhosted exported config JSON file.",
      width: "narrow",
      content: `
        <div class="form-grid">
          <div class="field full">
            <label for="importFileInput">JSON file</label>
            <input id="importFileInput" type="file" accept=".json,application/json">
          </div>
          <div class="help full">NightTab backup files are converted automatically. Selfhosted exports restore 1:1, including drag order and images uploaded as data URLs.</div>
          <div class="modal-footer full">
            <div></div>
            <div class="row">
              <button class="secondary" type="button" data-close-modal>Cancel</button>
              <button class="primary" type="button" id="runImportBtn">Import file</button>
            </div>
          </div>
        </div>
      `,
      onAfterOpen(){
        $("#runImportBtn", el.modalContent).addEventListener("click", async () => {
          const file = $("#importFileInput", el.modalContent).files?.[0];
          if (!file) {
            toast("Pick a JSON file first.");
            return;
          }
          const text = await file.text();
          let parsed;
          try {
            parsed = JSON.parse(text);
          } catch (err) {
            toast("That file is not valid JSON.");
            return;
          }

          let nextConfig = null;
          if (parsed?.meta?.appId === "nighttab-selfhosted" && parsed?.groups) {
            nextConfig = ensureConfigShape(parsed);
          } else if (parsed?.state && Array.isArray(parsed?.bookmark)) {
            nextConfig = ensureConfigShape(ntBackupToConfig(parsed));
          } else if (parsed?.config?.meta?.appId === "nighttab-selfhosted") {
            nextConfig = ensureConfigShape(parsed.config);
          }

          if (!nextConfig) {
            toast("That JSON does not look like a supported config file.");
            return;
          }

          state.config = nextConfig;
          render();
          saveLocalConfig(`Imported ${file.name}`);
          closeModal();
          toast("Import complete");
        });
      }
    });
  }

  function exportJsonFile(filename, data){
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }

  function configToNightTabBackup(){
    const base = deepClone(embeddedNightTabBackup);
    base.version = embeddedNightTabBackup.version || "7.5.0";
    base.state = base.state || {};
    base.state.layout = base.state.layout || {};
    base.state.header = base.state.header || {};
    base.state.theme = base.state.theme || {};
    base.state.theme.background = base.state.theme.background || {};
    base.state.theme.background.image = base.state.theme.background.image || {};
    base.state.layout.title = state.config.title;
    base.state.header.search = base.state.header.search || { engine: { custom: {} } };
    base.state.header.search.show = state.config.search.enabled;
    base.state.header.search.newTab = state.config.search.openInNewTab;
    base.state.header.search.engine = base.state.header.search.engine || {};
    base.state.header.search.engine.selected = "custom";
    const activeProviderForExport = getDefaultSearchProvider();
    base.state.header.search.engine.custom = {
      url: activeProviderForExport?.baseUrl || state.config.search.url,
      name: activeProviderForExport?.label || state.config.search.name,
      queryName: activeProviderForExport?.queryParam || state.config.search.queryName,
    };
    base.state.theme.background.image.url = state.config.appearance.backgroundUrl || "";
    base.bookmark = state.config.groups.map((group) => ({
      name: { text: group.name, show: true },
      collapse: !!group.collapsed,
      toolbar: { size: 100, openAll: { show: true }, collapse: { show: true } },
      items: group.items.map((item) => ({
        url: item.url,
        display: {
          alignment: "center-center",
          direction: "vertical",
          order: "visual-name",
          rotate: 0,
          translate: { x: 0, y: 0 },
          gutter: 25,
          name: { show: true, text: item.title || "", size: 7 },
          visual: {
            show: true,
            type: item.visualType === "image" ? "image" : item.visualType === "favicon" ? "icon" : "letter",
            size: 25,
            letter: { text: item.badgeText || item.title || deriveTitleFromUrl(item.url) },
            icon: { name: "", prefix: "", label: "" },
            image: { url: item.imageUrl || "" },
            shadow: { size: 0 }
          }
        },
        accent: { by: "theme", hsl: { h:0,s:0,l:0 }, rgb: { r:0,g:0,b:0 } },
        color: { by: "theme", hsl: { h:0,s:0,l:0 }, rgb: { r:0,g:0,b:0 }, opacity: 100 },
        background: { show: false, type: "image", opacity: 100, image: { url: "" }, video: { url: "" } },
        border: 0,
        shape: { wide: false, tall: false },
        timestamp: Date.now(),
      }))
    }));
    return base;
  }

  function openExportModal(){
    openModal({
      title: "Export",
      subtitle: "Download the current config or a best-effort NightTab-compatible backup.",
      width: "narrow",
      content: `
        <div class="form-grid">
          <div class="field full">
            <button type="button" class="primary" id="exportSelfBtn">Download selfhosted config</button>
            <div class="help">Best for restoring this page exactly as it looks now, including drag order and uploaded images.</div>
          </div>
          <div class="field full">
            <button type="button" class="secondary" id="exportNightTabBtn">Download NightTab-style backup</button>
            <div class="help">Best effort export of title, search, background, groups and links back into a NightTab-shaped JSON.</div>
          </div>
          <div class="modal-footer full">
            <div></div>
            <div class="row">
              <button class="secondary" type="button" data-close-modal>Close</button>
            </div>
          </div>
        </div>
      `,
      onAfterOpen(){
        $("#exportSelfBtn", el.modalContent).addEventListener("click", () => {
          const payload = deepClone(state.config);
          payload.meta = payload.meta || {};
          payload.meta.appId = "nighttab-selfhosted";
          payload.meta.appVersion = APP_VERSION;
          payload.meta.exportedAt = new Date().toISOString();
          exportJsonFile(`nighttab-selfhosted-config-v${APP_VERSION}.json`, payload);
          toast("Selfhosted config downloaded");
        });
        $("#exportNightTabBtn", el.modalContent).addEventListener("click", () => {
          exportJsonFile(`nighttab-backup-compatible-v${APP_VERSION}.json`, configToNightTabBackup());
          toast("NightTab-style backup downloaded");
        });
      }
    });
  }

  function openHistoryModal(){
    const history = readHistory();
    openModal({
      title: "Versions",
      subtitle: "Local snapshots saved in your browser every time you make a change.",
      content: `
        <div class="history-list">
          ${history.length ? history.map((entry) => `
            <div class="history-item">
              <div>
                <div class="history-item-title">${escapeHtml(entry.note || "Saved state")}</div>
                <div class="history-item-meta">${formatDateTime(entry.at)}</div>
              </div>
              <div class="row">
                <button type="button" class="small secondary" data-history-action="download" data-history-id="${entry.id}">Download</button>
                <button type="button" class="small primary" data-history-action="restore" data-history-id="${entry.id}">Restore</button>
              </div>
            </div>
          `).join("") : `<div class="empty-state">No saved versions yet. Start editing and the page will build a local history for you.</div>`}
        </div>
        <div class="modal-footer full">
          <div><button class="danger ${history.length ? "" : "hidden"}" type="button" id="clearHistoryBtn">Clear version history</button></div>
          <div class="row">
            <button class="secondary" type="button" data-close-modal>Close</button>
          </div>
        </div>
      `,
      onAfterOpen(){
        $$("[data-history-action]", el.modalContent).forEach((btn) => btn.addEventListener("click", () => {
          const entry = history.find((x) => x.id === btn.dataset.historyId);
          if (!entry) return;
          if (btn.dataset.historyAction === "restore") {
            if (!confirm(`Restore "${entry.note}" from ${formatDateTime(entry.at)}?`)) return;
            state.config = ensureConfigShape(entry.config);
            render();
            saveLocalConfig("Restored version");
            closeModal();
            toast("Version restored");
          }
          if (btn.dataset.historyAction === "download") {
            exportJsonFile(`nighttab-selfhosted-history-${entry.id}.json`, entry.config);
          }
        }));

        $("#clearHistoryBtn", el.modalContent)?.addEventListener("click", () => {
          if (!confirm("Clear all local version history?")) return;
          localStorage.removeItem(HISTORY_KEY);
          closeModal();
          toast("Version history cleared");
        });
      }
    });
  }

  function runSearch(event){
    event.preventDefault();
    const query = el.searchInput.value.trim();
    if (!query) return;
    const provider = getDefaultSearchProvider();
    const url = buildSearchUrl(provider, query);
    if (state.config.search.openInNewTab) {
      window.open(url, "_blank", "noopener");
    } else {
      location.href = url;
    }
  }

  function boot(){
    state.config = loadInitialConfig();
    render();
    setInterval(formatClockAndDate, 30 * 1000);
  }

  el.searchForm.addEventListener("submit", runSearch);
  if (el.searchProviderBtn) {
    el.searchProviderBtn.addEventListener('click', (event) => {
      event.preventDefault();
      const open = el.searchProviderMenu.classList.toggle('hidden');
      el.searchProviderBtn.setAttribute('aria-expanded', String(!open));
    });
    el.searchProviderMenu.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-provider-id]');
      if (!btn) return;
      state.config.search.defaultProviderId = btn.dataset.providerId;
      const provider = getDefaultSearchProvider();
      state.config.search.name = provider.label;
      state.config.search.url = provider.baseUrl;
      state.config.search.queryName = provider.queryParam;
      renderSearchProviderMenu();
      saveLocalConfig(`Switched search provider to ${provider.label}`);
      el.searchProviderMenu.classList.add('hidden');
      el.searchProviderBtn.setAttribute('aria-expanded', 'false');
      el.searchInput.focus();
    });
    document.addEventListener('click', (event) => {
      if (!el.searchProviderMenu || !el.searchProviderBtn) return;
      if (el.searchProviderMenu.contains(event.target) || el.searchProviderBtn.contains(event.target)) return;
      el.searchProviderMenu.classList.add('hidden');
      el.searchProviderBtn.setAttribute('aria-expanded', 'false');
    });
  }
  el.editToggle.addEventListener("click", () => {
    state.editMode = !state.editMode;
    render();
  });
  el.addGroupTopBtn.addEventListener("click", () => openGroupModal());
  el.addGroupFab.addEventListener("click", () => openGroupModal());
  el.settingsBtn.addEventListener("click", openSettingsModal);
  if (el.historyBtn) el.historyBtn.addEventListener("click", openHistoryModal);
  el.importBtn.addEventListener("click", openImportModal);
  el.exportBtn.addEventListener("click", openExportModal);

  boot();
})();
</script>
</body>
</html>
